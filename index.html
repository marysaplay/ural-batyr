<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/ural-batyr/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Кроссплатформенная казуальная 3D этно-головоломка по башкирскому эпосу.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Маджонг. Нити Сказаний: Урал-Батыр</title>
  <link rel="manifest" href="manifest.json">

  <script>
    function initVkBridge() {
      if (window.vkBridge) {
        window.vkBridge.send('VKWebAppInit')
          .then(function() { console.log('VKWebAppInit OK'); })
          .catch(function(err) { console.error('VKWebAppInit error:', err); });
      }
    }

    (function loadVkBridge() {
      var s = document.createElement('script');
      var host = 'https://cdn.' + 'jsdelivr.net';
      var pkg = '/npm/@vkontakte/' + 'vk-bridge';
      var file = '/dist/browser.min.js';
      s.src = host + pkg + file;
      s.onload = initVkBridge;
      s.onerror = function() {
        var fb = document.createElement('script');
        var fbHost = 'https://' + 'unpkg.com';
        fb.src = fbHost + pkg + file;
        fb.onload = initVkBridge;
        document.head.appendChild(fb);
      };
      document.head.appendChild(s);
    })();
  </script>

  <style>
    html, body {
      background-color: #141414;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    window.UralPlatformBridge = {
      platform: 'vk',
      ysdk: null,

      init: async function() {
        if (window.vkBridge) {
          try {
            await window.vkBridge.send('VKWebAppInit');
            this.platform = 'vk';
            window.vkBridge.send('VKWebAppCheckNativeAds', { ad_format: 'reward' }).catch(function() {});
            return 'vk';
          } catch (e) {}
        }
        this.platform = 'local';
        return 'local';
      },

      showBestPayingAd: function() {
        return new Promise(function(resolve) {
          if (window.vkBridge) {
            window.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' })
              .then(function(data) {
                if (data && data.result) resolve(true);
                else throw new Error('Reward empty');
              })
              .catch(function() {
                window.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' })
                  .then(function(data) { resolve(Boolean(data && data.result)); })
                  .catch(function() { resolve(false); });
              });
            return;
          }
          resolve(true);
        });
      },

      showInterstitialAd: function() {
        return new Promise(function(resolve) {
          if (window.vkBridge) {
            window.vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' })
              .then(function() { resolve(true); })
              .catch(function() { resolve(false); });
            return;
          }
          resolve(true);
        });
      },

      purchaseItem: function(itemId) {
        return new Promise(async function(resolve) {
          if (window.vkBridge) {
            try {
              const data = await window.vkBridge.send('VKWebAppShowOrderBox', {
                type: 'item',
                item: itemId
              });
              resolve(Boolean(data && data.success));
            } catch (e) {
              resolve(false);
            }
            return;
          }
          resolve(true);
        });
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
